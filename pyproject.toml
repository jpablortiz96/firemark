[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firemark"
version = "0.1.0"
description = "Provenance-preserving controls for generative media delivery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Juan Pablo Enriquez Ortiz" },
]
dependencies = [
  "boto3==1.43.58",
  "botocore==1.43.58",
  "fastapi==0.139.2",
  "genblaze-core==0.3.8",
  "genblaze-s3==0.3.6",
  "httpx==0.28.1",
  "openai==2.50.0",
  "cryptography",
  "pydantic",
  "python-dotenv",
  "supabase==2.31.0",
  "urllib3>=2,<3",
  "uvicorn==0.52.0",
]

[project.optional-dependencies]
dev = [
  "genblaze-cli==0.3.6",
  "mypy",
  "packaging",
  "Pillow",
  "pytest",
  "pytest-cov",
  "ruff",
]

[tool.setuptools.packages.find]
include = ["api", "api.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = [
  "live_b2: contacts only an explicitly configured Backblaze B2 endpoint",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
warn_unreachable = true
pretty = true
show_error_codes = true
files = ["api", "scripts"]
