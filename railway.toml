[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/bin/sh -c \"exec uvicorn api.firemark.app:create_app --factory --host 0.0.0.0 --port ${PORT} --workers 1 --timeout-graceful-shutdown 30 --no-server-header\""
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
drainingSeconds = "30"
