<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" width="1440" height="640" role="img" aria-labelledby="mhTitle mhDesc" font-family="Inter, ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif">
  <title id="mhTitle">FIREMARK multimodal hash contracts</title>
  <desc id="mhDesc">Two lanes. The image lane takes a provider JPEG, hashes it as source_sha256, builds canonical provenance, normalizes deterministically to PNG, embeds the public capsule and produces a different sealed_sha256 that is verifiable from the embedded capsule. The audio lane takes a provider MP3, hashes it, builds canonical provenance and applies a byte-preserving seal, so sealed_sha256 equals source_sha256 and verification uses a certificate ID plus a locally computed hash.</desc>
  <defs>
    <linearGradient id="mh-ember" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5a1f"/><stop offset="1" stop-color="#ffad32"/></linearGradient>
    <marker id="mh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff5a1f"/></marker>
    <marker id="mh-arrow-cool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8dffbc"/></marker>
  </defs>
  <rect width="1440" height="640" fill="#070808"/>
  <rect width="1440" height="3" fill="url(#mh-ember)"/>

  <text x="40" y="52" font-size="24" font-weight="800" fill="#f4f1e9" letter-spacing="-0.4">Media-aware trust contracts</text>
  <text x="40" y="76" font-family="Consolas, monospace" font-size="14" fill="#777a75" letter-spacing="1">Verification is not identical for every medium — and FIREMARK never pretends it is.</text>

  <!-- ===================== IMAGE LANE ===================== -->
  <g>
    <rect x="40" y="104" width="1360" height="234" rx="4" fill="#0d0f0f" stroke="#2b2e2c" stroke-width="1.5"/>
    <rect x="40" y="104" width="4" height="234" fill="#ff5a1f"/>
    <text x="68" y="138" font-size="18" font-weight="700" fill="#f4f1e9">Image — Google Gemini · Nano Banana 2</text>
    <text x="68" y="160" font-family="Consolas, monospace" font-size="13" fill="#ff5a1f" letter-spacing="1.4">source_sha256 ≠ sealed_sha256 — the capsule changes the container</text>

    <g font-size="14">
      <rect x="68" y="182" width="182" height="88" rx="3" fill="#111414" stroke="#2b2e2c"/>
      <text x="159" y="210" text-anchor="middle" fill="#f4f1e9">Provider source</text>
      <text x="159" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#ffad32">image/jpeg</text>
      <text x="159" y="254" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#777a75">exact bytes retained</text>

      <rect x="292" y="182" width="182" height="88" rx="3" fill="#111414" stroke="#2b2e2c"/>
      <text x="383" y="210" text-anchor="middle" fill="#f4f1e9">source_sha256</text>
      <text x="383" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#777a75">before any embedding</text>
      <text x="383" y="254" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#8dffbc">e87ef038…4dc12e2e</text>

      <rect x="516" y="182" width="182" height="88" rx="3" fill="#111414" stroke="#2b2e2c"/>
      <text x="607" y="210" text-anchor="middle" fill="#ffad32">Genblaze</text>
      <text x="607" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#777a75">canonical manifest</text>
      <text x="607" y="254" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#777a75">stays private</text>

      <rect x="740" y="182" width="182" height="88" rx="3" fill="#111414" stroke="#2b2e2c"/>
      <text x="831" y="210" text-anchor="middle" fill="#f4f1e9">Normalize → PNG</text>
      <text x="831" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#777a75">deterministic, offline</text>
      <text x="831" y="254" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#777a75">metadata stripped</text>

      <rect x="964" y="182" width="182" height="88" rx="3" fill="#111414" stroke="#ff5a1f" stroke-opacity="0.5"/>
      <text x="1055" y="210" text-anchor="middle" fill="#ff5a1f">Embed capsule</text>
      <text x="1055" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#777a75">FiremarkPublicCapsuleV1</text>
      <text x="1055" y="254" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#777a75">deterministic tEXt chunk</text>

      <rect x="1188" y="182" width="182" height="88" rx="3" fill="#111414" stroke="#8dffbc" stroke-opacity="0.45"/>
      <text x="1279" y="210" text-anchor="middle" fill="#8dffbc">sealed_sha256</text>
      <text x="1279" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#777a75">the distributed PNG</text>
      <text x="1279" y="254" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#8dffbc">27996070…89dc009e</text>
    </g>
    <g stroke="#ff5a1f" stroke-width="2" fill="none" marker-end="url(#mh-arrow)">
      <path d="M250 226 H288"/><path d="M474 226 H512"/><path d="M698 226 H736"/><path d="M922 226 H960"/><path d="M1146 226 H1184"/>
    </g>
    <text x="68" y="300" font-family="Consolas, monospace" font-size="13" fill="#8dffbc">▸ Local verification: read the embedded capsule from the PNG, then confirm the sealed hash.</text>
    <text x="68" y="322" font-family="Consolas, monospace" font-size="13" fill="#777a75">▸ Certificate cert_id: firemark-cert-977dce1a6b5b7add352854900ddac911</text>
  </g>

  <!-- ===================== AUDIO LANE ===================== -->
  <g>
    <rect x="40" y="362" width="1360" height="234" rx="4" fill="#0d0f0f" stroke="#2b2e2c" stroke-width="1.5"/>
    <rect x="40" y="362" width="4" height="234" fill="#8dffbc"/>
    <text x="68" y="396" font-size="18" font-weight="700" fill="#f4f1e9">Audio — ElevenLabs</text>
    <text x="68" y="418" font-family="Consolas, monospace" font-size="13" fill="#8dffbc" letter-spacing="1.4">source_sha256 = sealed_sha256 — sealing is byte-preserving by design</text>

    <g font-size="14">
      <rect x="68" y="440" width="240" height="88" rx="3" fill="#111414" stroke="#2b2e2c"/>
      <text x="188" y="468" text-anchor="middle" fill="#f4f1e9">Provider source</text>
      <text x="188" y="490" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#ffad32">audio/mpeg</text>
      <text x="188" y="512" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#777a75">mp3_44100_128</text>

      <rect x="350" y="440" width="240" height="88" rx="3" fill="#111414" stroke="#2b2e2c"/>
      <text x="470" y="468" text-anchor="middle" fill="#f4f1e9">source_sha256</text>
      <text x="470" y="490" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#777a75">over untouched bytes</text>
      <text x="470" y="512" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#8dffbc">3863c40f…c870b82a</text>

      <rect x="632" y="440" width="240" height="88" rx="3" fill="#111414" stroke="#2b2e2c"/>
      <text x="752" y="468" text-anchor="middle" fill="#ffad32">Genblaze</text>
      <text x="752" y="490" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#777a75">canonical manifest</text>
      <text x="752" y="512" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#777a75">stays private</text>

      <rect x="914" y="440" width="240" height="88" rx="3" fill="#111414" stroke="#2b2e2c"/>
      <text x="1034" y="468" text-anchor="middle" fill="#f4f1e9">Byte-preserving seal</text>
      <text x="1034" y="490" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#777a75">no fake embedded capsule</text>
      <text x="1034" y="512" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#777a75">audio bytes unchanged</text>

      <rect x="1196" y="440" width="174" height="88" rx="3" fill="#111414" stroke="#8dffbc" stroke-opacity="0.45"/>
      <text x="1283" y="468" text-anchor="middle" fill="#8dffbc">sealed_sha256</text>
      <text x="1283" y="490" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#777a75">identical digest</text>
      <text x="1283" y="512" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#8dffbc">3863c40f…c870b82a</text>
    </g>
    <g stroke="#8dffbc" stroke-width="2" fill="none" marker-end="url(#mh-arrow-cool)">
      <path d="M308 484 H346"/><path d="M590 484 H628"/><path d="M872 484 H910"/><path d="M1154 484 H1192"/>
    </g>
    <text x="68" y="558" font-family="Consolas, monospace" font-size="13" fill="#8dffbc">▸ Local verification: supply the public cert_id and a locally computed SHA-256 — no embedded capsule is claimed.</text>
    <text x="68" y="580" font-family="Consolas, monospace" font-size="13" fill="#777a75">▸ Certificate cert_id: firemark-cert-e0c6fbf7bfc482f765c636963cfcbbbf</text>
  </g>
</svg>
